<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal RAG workflow</title>
  <desc id="desc">Company data is embedded and stored in a vector database. A user search becomes a question, which retrieves context and is sent with the question to a generative AI model for a reliable answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#1d1d1f" stroke-width="1.8"/></marker>
    <style>
      .box{fill:#fff;stroke:#1d1d1f;stroke-width:2.4}.line{fill:none;stroke:#1d1d1f;stroke-width:2.4;marker-end:url(#arrow)}.label{font-family:Arial,Helvetica,sans-serif;fill:#202124;font-size:25px;font-weight:600}.note{font-family:Arial,Helvetica,sans-serif;fill:#202124;font-size:17px}.icon{fill:none;stroke:#202124;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="750" fill="#fafafa"/>
  <!-- top: knowledge preparation -->
  <text x="145" y="100" class="note" font-weight="700">COMPANY DATA</text>
  <path d="M250 150H315" class="line"/>
  <rect x="315" y="110" width="275" height="82" rx="12" class="box"/>
  <path d="M344 133h31v25h-18l-9 8v-8h-4zM351 145h3m6 0h3m6 0h3" class="icon"/>
  <text x="395" y="160" class="label">Embedding Model</text>
  <path d="M590 151H655" class="line"/>
  <rect x="655" y="110" width="255" height="82" rx="12" class="box"/>
  <path d="M686 136c0-7 26-7 26 0v26c0 7-26 7-26 0zm0 13c0 7 26 7 26 0m-26 0v13c0 7 26 7 26 0" class="icon"/>
  <text x="730" y="160" class="label">Vector Database</text>
  <!-- main response path -->
  <rect x="80" y="395" width="220" height="92" rx="12" class="box"/>
  <path d="M120 433a14 14 0 1 1 20 0l12 12M132 445l-5 5" class="icon"/>
  <text x="171" y="451" class="label">Search</text>
  <path d="M300 441H365" class="line"/>
  <rect x="365" y="395" width="220" height="92" rx="12" class="box"/>
  <path d="M397 419h31v25h-18l-9 8v-8h-4zM404 431h3m6 0h3m6 0h3" class="icon"/>
  <text x="450" y="451" class="label">Question</text>
  <path d="M585 441H690" class="line"/>
  <rect x="690" y="370" width="300" height="142" rx="12" class="box"/>
  <path d="M725 410h31v25h-18l-9 8v-8h-4zM732 422h3m6 0h3m6 0h3" class="icon"/>
  <text x="780" y="435" class="label">Question +</text><text x="780" y="467" class="label">Context</text>
  <path d="M990 441H1055" class="line"/>
  <rect x="1055" y="395" width="240" height="92" rx="12" class="box"/>
  <path d="M1095 428l5 11 11 5-11 5-5 11-5-11-11-5 11-5zm18-10l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" class="icon"/>
  <text x="1143" y="451" class="label">Gen AI Model</text>
  <path d="M1295 441H1360" class="line"/>
  <rect x="1360" y="395" width="190" height="92" rx="12" class="box"/>
  <path d="M1392 419h31v25h-18l-9 8v-8h-4z" class="icon"/>
  <text x="1443" y="451" class="label">Answer</text>
  <!-- retrieval connector -->
  <path d="M782 192V300Q782 320 802 320H840Q860 320 860 340V370" class="line"/>
  <circle cx="782" cy="192" r="4.5" fill="#1d1d1f"/>
  <path d="M795 257H990" stroke="#1d1d1f" stroke-width="1.8" stroke-dasharray="4 6"/>
  <text x="795" y="247" class="note">Relevant context from company data</text>
</svg>
